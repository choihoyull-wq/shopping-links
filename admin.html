<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>템빨살림 · 콕장터 Supabase 통합 관리자</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#25302e;margin:0}main{max-width:920px;margin:auto;padding:20px}section{background:white;border-radius:15px;padding:19px;margin:15px 0;box-shadow:0 2px 12px #0001}h1{font-size:26px}h2{font-size:19px}p,small{color:#65716c}label{display:block;margin:11px 0 5px;font-weight:650}input,select{width:100%;border:1px solid #ccd6d1;border-radius:9px;padding:11px;font:inherit}input[type=checkbox]{width:auto}button{background:#245b4c;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5}.secondary{background:#65736f}.danger{background:#aa4242}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#fff5df;padding:12px;border-radius:10px}.item{display:flex;align-items:center;gap:12px;border:1px solid #e0e6e2;border-radius:12px;padding:10px;margin:9px 0}.item img{width:60px;height:60px;object-fit:cover;border-radius:8px}.seq{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;background:#e2eee8;color:#245b4c;font-weight:800}.item .info{flex:1;min-width:0;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap}#status{white-space:pre-wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}main{padding:12px}}</style></head>
<body><main><h1>🛍️ 템빨살림 · 콕장터 통합 관리자</h1><p>두 채널 상품을 Supabase에 저장합니다. GitHub 게시 버튼은 필요하지 않습니다.</p>
<section id="loginBox"><h2>🔐 관리자 로그인</h2><label>Supabase 관리자 이메일</label><input id="email" type="email" autocomplete="username"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><button id="login">로그인</button><p id="loginStatus" role="status"></p></section>
<section id="recoveryBox" hidden><h2>새 비밀번호 설정</h2><form id="recoveryForm"><label>새 비밀번호 (8자 이상)</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"><label>새 비밀번호 확인</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button id="resetPassword" type="submit">새 비밀번호 저장</button></form><p id="recoveryStatus" role="status"></p></section><div id="workspace" hidden><section><p id="who"></p><button class="secondary" id="logout">로그아웃</button><p class="notice">상품을 저장하거나 삭제하면 두 홈페이지에서 다음 조회 시 반영됩니다. 사진은 작은 JPEG로 변환하여 저장합니다.</p></section>
<section><h2 id="formTitle">상품 등록</h2><form id="form"><input type="hidden" id="editId"><label>채널</label><select id="brand"><option value="temppal">템빨살림</option><option value="kok">콕장터</option></select><div class="grid"><div><label>상품명 *</label><input id="name" required maxlength="120"></div><div><label>구매 링크 *</label><input id="url" type="url" required></div></div><label>상품 사진 (새 상품은 필수)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><label><input id="visible" type="checkbox" checked> 홈페이지에 표시 (현재 DB에서는 체크된 상품만 저장·노출)</label><button type="submit" id="save">상품 저장</button><button type="button" class="secondary" id="cancel">취소</button></form></section>
<section><h2>등록 상품 <span id="count"></span></h2><label>채널 필터</label><select id="filter"><option value="all">전체</option><option value="temppal">템빨살림</option><option value="kok">콕장터</option></select><div id="items"></div></section>
<section><h2>기존 상품 백업 가져오기</h2><p>기존 JSON의 상품을 중복 확인 후 Supabase로 등록합니다. 기존 상품은 삭제하지 않습니다.</p><input id="backup" type="file" accept=".json,application/json"><button id="import" type="button">백업 상품 가져오기</button><button id="export" type="button" class="secondary">현재 데이터 JSON 백업</button></section></div>
<section><p id="status" role="status" aria-live="polite">관리자 로그인이 필요합니다.</p></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const recoveryRequested=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
let recovering=recoveryRequested;
const db=supabase.createClient("https://dafzmhregccsdwiesafs.supabase.co","sb_publishable_qOD9eacoIOemvTrq-L5TjA_dPyAcBQR");
const $=id=>document.getElementById(id),brands={temppal:'템빨살림',kok:'콕장터'};let products=[],currentUser=null;
function status(s,err=false){$('status').textContent=s;$('status').style.color=err?'#aa4242':'#245b4c'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function valid(s){try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}}
async function init(){if(recovering){$('loginBox').hidden=true;$('workspace').hidden=true;$('recoveryBox').hidden=false;return;}const {data}=await db.auth.getUser();currentUser=data.user||null;$('loginBox').hidden=!!currentUser;$('workspace').hidden=!currentUser;if(currentUser){$('who').textContent='로그인: '+currentUser.email;await refresh()}}
$('login').onclick=async()=>{$('login').disabled=true;$('loginStatus').textContent='로그인 중…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('login').disabled=false;if(error){$('loginStatus').textContent='로그인 실패: '+error.message;return}$('loginStatus').textContent='';await init();status('로그인 완료')};
$('logout').onclick=async()=>{await db.auth.signOut();products=[];await init();status('로그아웃했습니다.')};
async function refresh(){const {data,error}=await db.from('products').select('id,channel,product_number,product_name,product_url,image_url').order('product_number',{ascending:true});if(error){status('조회 실패: '+error.message,true);return}products=data||[];render();status('Supabase 상품 '+products.length+'개 불러왔습니다.')}
function render(){const f=$('filter').value;const list=products.filter(p=>f==='all'||p.channel===f);$('count').textContent='('+list.length+'개)';$('items').innerHTML='';for(const p of list){const row=document.createElement('div');row.className='item';const img=p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'';row.innerHTML='<span class="seq">'+esc(p.product_number??'')+'</span>'+img+'<div class="info"><b>'+esc(p.product_name)+'</b><small>'+esc(brands[p.channel]||p.channel)+'</small><small>'+esc(p.product_url)+'</small></div><div class="actions"><button class="secondary" data-action="edit">수정</button><button class="danger" data-action="delete">삭제</button></div>';row.querySelector('[data-action=edit]').onclick=()=>edit(p);row.querySelector('[data-action=delete]').onclick=()=>remove(p);$('items').appendChild(row)}}
$('filter').onchange=render;
function edit(p){$('editId').value=p.id;$('brand').value=p.channel;$('name').value=p.product_name;$('url').value=p.product_url;$('photo').value='';$('formTitle').textContent='상품 수정';window.scrollTo({top:0,behavior:'smooth'})}
function reset(){$('form').reset();$('editId').value='';$('formTitle').textContent='상품 등록'}$('cancel').onclick=reset;
async function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),src=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,520/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(src);resolve(c.toDataURL('image/jpeg',.72))}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(src);reject(Error('이미지 읽기 실패'))};img.src=src})}
async function saveRow(row){const {error}=await db.from('products').insert(row);if(error)throw Error(error.message)}
$('form').onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const id=$('editId').value,channel=$('brand').value,name=$('name').value.trim(),link=$('url').value.trim();if(!name||!valid(link)){status('상품명과 올바른 구매 링크를 입력해 주세요.',true);return}if(!$('visible').checked){status('현재 DB에는 표시 여부 컬럼이 확인되지 않아 숨김 저장을 지원하지 않습니다. 체크해 주세요.',true);return}const old=products.find(p=>String(p.id)===id);let image=old?.image_url||'';if($('photo').files[0])image=await compress($('photo').files[0]);if(!image){status('상품 사진을 선택해 주세요.',true);return}$('save').disabled=true;try{if(old){const {error}=await db.from('products').update({channel,product_name:name,product_url:link,image_url:image}).eq('id',old.id);if(error)throw Error(error.message)}else{const next=Math.max(0,...products.filter(p=>p.channel===channel).map(p=>Number(p.product_number)||0))+1;await saveRow({channel,product_number:next,product_name:name,product_url:link,image_url:image})}reset();await refresh();status('상품이 저장되었습니다.')}catch(err){status('저장 실패: '+err.message,true)}finally{$('save').disabled=false}};
async function remove(p){if(!confirm(brands[p.channel]+' 상품 "'+p.product_name+'"을 삭제할까요?'))return;const {error}=await db.from('products').delete().eq('id',p.id);if(error){status('삭제 실패: '+error.message,true);return}await refresh();status('삭제했습니다.')}
$('import').onclick=async()=>{const f=$('backup').files[0];if(!f){status('JSON 백업 파일을 선택해 주세요.',true);return}let raw;try{raw=JSON.parse(await f.text())}catch{status('올바른 JSON 파일이 아닙니다.',true);return}const list=Array.isArray(raw.products)?raw.products:[];const pending=list.filter(p=>brands[p.brand]&&p.name&&valid(p.url)&&p.image&&!products.some(x=>x.channel===p.brand&&x.product_name===p.name&&x.product_url===p.url));if(!pending.length){status('가져올 새 상품이 없습니다.');return}if(!confirm('기존 상품은 유지하고 '+pending.length+'개를 추가할까요?'))return;$('import').disabled=true;let done=0;try{for(const p of pending){const next=Math.max(0,...products.filter(x=>x.channel===p.brand).map(x=>Number(x.product_number)||0))+1;await saveRow({channel:p.brand,product_number:next,product_name:p.name,product_url:p.url,image_url:p.image});products.push({channel:p.brand,product_number:next,product_name:p.name,product_url:p.url,image_url:p.image});done++}await refresh();status('백업 상품 '+done+'개 가져오기 완료.')}catch(e){await refresh();status(done+'개 등록 후 중단: '+e.message,true)}finally{$('import').disabled=false}};
$('export').onclick=()=>{const data={products:products.map(p=>({brand:p.channel,name:p.product_name,url:p.product_url,image:p.image_url,visible:true}))};const a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='supabase-상품백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;$('loginBox').hidden=true;$('workspace').hidden=true;$('recoveryBox').hidden=false;status('새 비밀번호를 입력하세요.');}});
$('recoveryForm').onsubmit=async e=>{e.preventDefault();const a=$('newPassword').value,b=$('confirmPassword').value;if(a!==b){$('recoveryStatus').textContent='비밀번호가 일치하지 않습니다.';return;}$('resetPassword').disabled=true;try{const {data,error:sessionError}=await db.auth.getSession();if(sessionError||!data.session)throw Error('재설정 링크가 만료되었거나 유효하지 않습니다. 새 메일을 요청하세요.');const {error}=await db.auth.updateUser({password:a});if(error)throw error;await db.auth.signOut();recovering=false;history.replaceState(null,'',location.pathname);$('recoveryForm').reset();$('recoveryBox').hidden=true;await init();$('loginStatus').textContent='비밀번호 변경 완료. 새 비밀번호로 로그인하세요.';status('비밀번호 변경 완료.');}catch(err){$('recoveryStatus').textContent=err.message;}finally{$('resetPassword').disabled=false;}};
init();
</script></body></html>
